
name: AutoMarket Performance Tests

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Select Performance Test'
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - load
          - stress
          - soak
          - breakpoint
          - recovery

jobs:
  performance-test:
    name: Run Homepage ${{ inputs.test_type }} Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run Selected Performance Test and Generate HTML Report
        env:
          BASE_URL: https://www.pakwheels.com
          TEST_TYPE: ${{ inputs.test_type }}
        shell: bash
        run: |
          mkdir -p Reports

          case "$TEST_TYPE" in
            smoke)
              SCRIPT="Scripts/homepage.js"
              REPORT="homepage-smoke"
              ;;
            load)
              SCRIPT="Scripts/homepage-load.js"
              REPORT="homepage-load"
              ;;
            stress)
              SCRIPT="Scripts/homepage-stress.js"
              REPORT="homepage-stress"
              ;;
            soak)
              SCRIPT="Scripts/homepage-soak.js"
              REPORT="homepage-soak"
              ;;
            breakpoint)
              SCRIPT="Scripts/homepage-breakpoint.js"
              REPORT="homepage-breakpoint"
              ;;
            recovery)
              SCRIPT="Scripts/homepage-recovery.js"
              REPORT="homepage-recovery"
              ;;
            *)
              echo "Invalid test selection"
              exit 1
              ;;
          esac

          SUMMARY_FILE="Reports/${REPORT}-summary.json"
          HTML_FILE="Reports/${REPORT}-report.html"

          set +e
          k6 run --summary-export "$SUMMARY_FILE" "$SCRIPT"
          K6_EXIT_CODE=$?
          set -e

          if [ -f "$SUMMARY_FILE" ]; then
            python Scripts/generate-html-report.py \
              --input "$SUMMARY_FILE" \
              --output "$HTML_FILE" \
              --test-name "$REPORT"
          else
            echo "k6 summary file was not generated."
            exit 1
          fi

          exit "$K6_EXIT_CODE"

      - name: Upload HTML and Raw k6 Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: AutoMarket-${{ inputs.test_type }}-Debug-Report
          path: Reports/
          if-no-files-found: warn
          retention-days: 30
